version: 2
updates:
  # NPM packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 4
    cooldown:
      semver-minor-days: 21
      semver-patch-days: 14
    rebase-strategy: "disabled"
    reviewers:
      - "TheGrandGear99"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

    # Group related updates into single PRs to reduce churn
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      eslint-and-typescript:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@types/*"
          - "eslint-*"
          - "svelte-eslint-parser"
          - "eslint-plugin-svelte"
      sveltekit-and-build:
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "esbuild"
      supabase:
        patterns:
          - "@supabase/*"
      stripe:
        patterns:
          - "stripe*"
      prettier:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
      playwright:
        patterns:
          - "playwright*"

    # Major-version holds: preserve low-noise Dependabot behavior after the
    # October 2026 SvelteKit 3 / adapter / Stripe 23 upgrades.
    # Do not pin out already-adopted major lines: permit 3.x, 8.x and 7.x
    # minor/patch fixes (including potentially important security fixes).
    # Ignore rules can also affect security update PRs requiring a blocked
    # major version. Keep Dependabot alerts on and review those manually.
    # Reassess these major holds in December 2026 / January 2027.
    ignore:
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/vite-plugin-svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/vite-plugin-svelte-inspector"
        update-types: ["version-update:semver-major"]
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/ui"
        update-types: ["version-update:semver-major"]
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major"]
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-auto"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-vercel"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cookie"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    reviewers:
      - "TheGrandGear99"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
